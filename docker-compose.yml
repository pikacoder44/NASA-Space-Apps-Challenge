services:
  db:
    image: postgres:16-alpine
    container_name: astrotrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-astrotrack_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-astro_user} -d $${POSTGRES_DB:-astrotrack_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: astrotrack_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://astro_user:astro_pass@db:5432/astrotrack_db}
      SECRET_KEY: ${SECRET_KEY:-insecure_dev_secret_key_for_hackathon_only}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      POSTGRES_USER: ${POSTGRES_USER:-astro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-astrotrack_db}
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
